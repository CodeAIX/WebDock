name: WebDock

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

environmentVariableTestSchemes: {}

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  WebDock:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/WebDock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.codeaix.WebDock
        PRODUCT_NAME: WebDock
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 12
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: WebDock
        DEVELOPMENT_LANGUAGE: en

  WebDockTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Tests/WebDockTests
    dependencies:
      - target: WebDock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.codeaix.WebDockTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  WebDock:
    build:
      targets:
        WebDock: all
        WebDockTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - WebDockTests
    archive:
      config: Release
