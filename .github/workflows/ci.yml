name: macOS CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'chore/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project definition
        id: project
        run: |
          if [[ -f project.yml ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "project.yml is not on this ref yet; CI bootstrap check only."
          fi

      - name: Validate LaunchServices declarations
        if: steps.project.outputs.available == 'true'
        run: |
          plutil -lint Config/Info.plist
          python3 scripts/validate_document_types.py

      - name: Select Xcode
        if: steps.project.outputs.available == 'true'
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        if: steps.project.outputs.available == 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.project.outputs.available == 'true'
        run: |
          xcodegen generate
          xcodebuild -project WebDock.xcodeproj -scheme WebDock -list

      - name: Build and test
        if: steps.project.outputs.available == 'true'
        run: |
          set -o pipefail
          xcodebuild \
            -project WebDock.xcodeproj \
            -scheme WebDock \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean test
