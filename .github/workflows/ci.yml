name: macOS CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project definition
        id: project
        run: |
          if [[ -f project.yml ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "project.yml is not on this ref yet; CI bootstrap check only."
          fi

      - name: Validate source contract
        if: steps.project.outputs.available == 'true'
        run: |
          plutil -lint Config/Info.plist
          python3 scripts/validate_document_types.py Config/Info.plist
          python3 scripts/validate_localizations.py
          python3 scripts/validate_app_icon.py
          grep -q 'macOS: "13.0"' project.yml
          if grep -R -n -E 'CloudKit|com\.apple\.developer\.icloud|import SwiftData' Config project.yml Sources/WebDock; then
            echo "CloudKit/iCloud entitlement or SwiftData dependency must not return."
            exit 1
          fi

      - name: Select Xcode
        if: steps.project.outputs.available == 'true'
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        if: steps.project.outputs.available == 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.project.outputs.available == 'true'
        run: |
          xcodegen generate
          xcodebuild -project WebDock.xcodeproj -scheme WebDock -list

      - name: Build and test for macOS 13 deployment
        if: steps.project.outputs.available == 'true'
        env:
          DERIVED_DATA: ${{ runner.temp }}/WebDockDerivedData
        run: |
          set -euo pipefail
          xcodebuild \
            -project WebDock.xcodeproj \
            -scheme WebDock \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            MACOSX_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean test

          APP_PLIST="$DERIVED_DATA/Build/Products/Debug/WebDock.app/Contents/Info.plist"
          plutil -lint "$APP_PLIST"
          python3 scripts/validate_document_types.py "$APP_PLIST"
          test "$(plutil -extract LSMinimumSystemVersion raw "$APP_PLIST")" = "13.0"
