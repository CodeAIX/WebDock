name: macOS Smoke Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'

permissions:
  contents: read

jobs:
  package-smoke-app:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          brew install xcodegen

      - name: Validate source contract
        run: |
          plutil -lint Config/Info.plist
          python3 scripts/validate_document_types.py Config/Info.plist
          python3 scripts/validate_localizations.py
          python3 scripts/validate_app_icon.py
          grep -q 'macOS: "13.0"' project.yml
          if grep -R -n -E 'CloudKit|com\.apple\.developer\.icloud|import SwiftData' Config project.yml Sources/WebDock; then
            echo "CloudKit/iCloud entitlement or SwiftData dependency must not return."
            exit 1
          fi

      - name: Generate project
        run: xcodegen generate

      - name: Build universal Release app for macOS 13+
        env:
          DERIVED_DATA: ${{ runner.temp }}/WebDockDerivedData
        run: |
          set -euo pipefail
          xcodebuild \
            -project WebDock.xcodeproj \
            -scheme WebDock \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            MACOSX_DEPLOYMENT_TARGET=13.0 \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

          APP="$DERIVED_DATA/Build/Products/Release/WebDock.app"
          test -d "$APP"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Verify built app contract
        run: |
          set -euo pipefail
          plutil -lint "$APP_PATH/Contents/Info.plist"
          python3 scripts/validate_document_types.py "$APP_PATH/Contents/Info.plist"
          python3 scripts/validate_app_icon.py --app "$APP_PATH"
          test "$(plutil -extract LSMinimumSystemVersion raw "$APP_PATH/Contents/Info.plist")" = "13.0"
          ARCHS_OUTPUT="$(lipo -archs "$APP_PATH/Contents/MacOS/WebDock")"
          echo "Architectures: $ARCHS_OUTPUT"
          echo "$ARCHS_OUTPUT" | grep -q arm64
          echo "$ARCHS_OUTPUT" | grep -q x86_64

      - name: Ad-hoc sign smoke bundle
        run: |
          set -euo pipefail
          codesign \
            --force \
            --deep \
            --sign - \
            --timestamp=none \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=2 "$APP_PATH" 2>&1

      - name: Package app
        env:
          OUTPUT_DIR: ${{ runner.temp }}/WebDockSmoke
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          ZIP="$OUTPUT_DIR/WebDock-smoke-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP"
          shasum -a 256 "$ZIP" | tee "$OUTPUT_DIR/WebDock-smoke-macos.zip.sha256"
          unzip -t "$ZIP"

      - name: Upload smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDock-smoke-macos
          path: |
            ${{ runner.temp }}/WebDockSmoke/WebDock-smoke-macos.zip
            ${{ runner.temp }}/WebDockSmoke/WebDock-smoke-macos.zip.sha256
          if-no-files-found: error
          retention-days: 14
